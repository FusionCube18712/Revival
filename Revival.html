<script type="text/babel">


const SESSION_TIME = 240;

function tilePx(t){ return t * window.TILE; }

const ORDER_DEFS = [
  { id:'cinder', reward: 60,  baseTime: 50 },
  { id:'mire',   reward: 90,  baseTime: 55 },
  { id:'rune',   reward: 220, baseTime: 75 },
  { id:'core',   reward: 600, baseTime: 110 },
];

function makeInitialState() {
  
  const startTile = 12;
  const player = {
    x: tilePx(startTile),
    y: tilePx(window.groundAt(startTile)),
    vx: 0, vy: 0,
    facing: 1,
    grounded: true,
    holding: null,
  };
  const nodes = {};
  window.NODE_DEFS.forEach(n => {
    nodes[n.id] = { stock: 14, depleted: false, cooldown: 0 };
  });
  const machines = {};
  window.MACHINE_DEFS.forEach(m => {
    machines[m.id] = {
      inputs: [],
      processing: false,
      progress: 0,
      duration: m.duration || 4,
      ready: false,
      output: null,
    };
  });
  return {
    player,
    nodes,
    machines,
    drops: [],
    particles: [],
    orders: [],
    nextOrderIn: 3,
    nextOrderId: 1,
    score: 0,
    combo: 0,
    comboTimer: 0,
    timeLeft: SESSION_TIME,
    alive: 0.0,
    camX: 0,
    shake: 0,
    nextDropId: 1,
    started: false,
    over: false,
    paused: false,
  };
}

function emitParticles(state, x, y, opts = {}) {
  const n = opts.n || 8;
  const color = opts.color || '#ffb15a';
  const speed = opts.speed || 60;
  const life = opts.life || .7;
  const size = opts.size || 2;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (.4 + Math.random() * .8);
    state.particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - (opts.upward || 0),
      gravity: opts.gravity ?? 80,
      life: life * (.6 + Math.random() * .8),
      maxLife: life,
      color,
      size,
    });
  }
}

function step(state, dt, input, audio, hud, viewportW) {
  if (!state.started || state.over || state.paused) return;

  
  state.timeLeft = Math.max(0, state.timeLeft - dt);
  if (state.timeLeft <= 0) {
    state.over = true;
    audio.play('end');
    return;
  }

  
  const p = state.player;
  const speed = 200;
  const gravity = 1200;
  const jumpV = 420;

  let ax = 0;
  if (input.left)  { ax -= 1; p.facing = -1; }
  if (input.right) { ax += 1; p.facing = 1; }
  p.vx = ax * speed * (input.sprint ? 1.5 : 1);

  if (input.jump && p.grounded) {
    p.vy = -jumpV;
    p.grounded = false;
    audio.play('jump');
  }
  p.vy += gravity * dt;
  p.x += p.vx * dt;
  p.y += p.vy * dt;

  p.x = Math.max(tilePx(2), Math.min(tilePx(window.WORLD_W - 4), p.x));

  const tileX = Math.floor(p.x / window.TILE);
  const gy = tilePx(window.groundAt(tileX));
  if (p.y >= gy) {
    if (!p.grounded && p.vy > 200) {
      emitParticles(state, p.x, gy, { n: 8, color:'#5a4a3a', speed: 80, life:.5, gravity: 200, size:2 });
    }
    p.y = gy;
    p.vy = 0;
    p.grounded = true;
  } else {
    p.grounded = false;
  }

  
  const worldPxW = tilePx(window.WORLD_W);
  const targetCam = p.x - viewportW / 2;
  state.camX += (targetCam - state.camX) * Math.min(1, dt * 5);
  state.camX = Math.max(0, Math.min(state.camX, worldPxW - viewportW));

  
  if (p.grounded && Math.abs(p.vx) > 80 && Math.random() < .3) {
    emitParticles(state, p.x - p.facing * 4, p.y, { n: 1, color:'#3a342a', speed: 20, life:.5, gravity: 60, size:2 });
  }

  
  for (const part of state.particles) {
    part.life -= dt;
    part.x += part.vx * dt;
    part.y += part.vy * dt;
    part.vy += part.gravity * dt;
  }
  state.particles = state.particles.filter(p => p.life > 0);

  
  for (const n of window.NODE_DEFS) {
    const ns = state.nodes[n.id];
    if (ns.cooldown > 0) ns.cooldown -= dt;
  }

  
  for (const m of window.MACHINE_DEFS) {
    const ms = state.machines[m.id];
    if (ms.processing) {
      ms.progress += dt / ms.duration;
      if (ms.progress >= 1) {
        ms.processing = false;
        ms.progress = 0;
        ms.inputs = [];
        ms.ready = true;
        ms.output = m.output;
        const px = tilePx(m.x);
        const py = tilePx(window.groundAt(m.x)) - 60;
        const def = window.ALL_ITEMS[m.output];
        emitParticles(state, px, py, { n: 24, color: def.glow, speed: 160, life:1.0, gravity: 60, upward: 80, size:2 });
        state.shake = 0.25;
        audio.play('done');
      }
    }
  }

  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 2);

  
  state.nextOrderIn -= dt;
  if (state.nextOrderIn <= 0 && state.orders.length < 4) {
    spawnOrder(state, hud);
    state.nextOrderIn = 10 + Math.random() * 8;
  }
  for (const o of state.orders) o.timeLeft -= dt;
  const expired = state.orders.filter(o => o.timeLeft <= 0 && !o.fulfilled);
  for (const e of expired) {
    state.combo = 0;
    state.comboTimer = 0;
    audio.play('fail');
    hud.toast('Order expired', 'bad');
  }
  state.orders = state.orders.filter(o => o.timeLeft > -.4);

  if (state.combo > 0) {
    state.comboTimer -= dt;
    if (state.comboTimer <= 0) state.combo = 0;
  }

  
  if (state.timeLeft > SESSION_TIME - 2 && state.orders.length === 0) {
    state.nextOrderIn = 0;
  }
}

function spawnOrder(state, hud) {
  const elapsed = SESSION_TIME - state.timeLeft;
  
  const easy = Math.max(0, 6 - elapsed * 0.05);
  const mid  = 4;
  const hard = Math.min(3, elapsed * 0.04);
  const top  = Math.min(2, Math.max(0, elapsed * 0.03 - 1));
  const weights = [
    { id:'cinder', w: easy + 2 },
    { id:'mire',   w: mid },
    { id:'rune',   w: hard },
    { id:'core',   w: top },
  ];
  const total = weights.reduce((a,b)=>a+b.w, 0);
  let r = Math.random() * total;
  let pick = 'cinder';
  for (const w of weights) { if ((r -= w.w) < 0) { pick = w.id; break; } }
  const def = ORDER_DEFS.find(o => o.id === pick);
  state.orders.push({
    oid: state.nextOrderId++,
    id: pick,
    timeLeft: def.baseTime,
    maxTime: def.baseTime,
    reward: def.reward,
    entering: true,
    fulfilled: false,
  });
  hud.toast('New order: ' + window.ALL_ITEMS[pick].name, 'good');
  hud.audio?.play('order');
}


function baseRes(id) {
  return window.NODE_TO_RES[id] || id;
}

function tryInteract(state, audio, hud) {
  const p = state.player;
  const range = tilePx(2.2);
  let best = null;
  let bestD = range;

  for (const n of window.NODE_DEFS) {
    const dx = Math.abs(p.x - tilePx(n.x));
    if (dx < bestD) { bestD = dx; best = { kind:'node', def:n }; }
  }
  for (const m of window.MACHINE_DEFS) {
    const dx = Math.abs(p.x - tilePx(m.x));
    if (dx < bestD) { bestD = dx; best = { kind:'machine', def:m }; }
  }
  for (const d of state.drops) {
    const dx = Math.abs(p.x - d.x);
    const dy = Math.abs(p.y - d.y);
    if (dx < bestD && dy < tilePx(3)) { bestD = dx; best = { kind:'drop', def:d }; }
  }
  const dxBoard = Math.abs(p.x - tilePx(window.BOARD_X));
  if (dxBoard < bestD) { bestD = dxBoard; best = { kind:'board' }; }

  if (!best) return;

  if (best.kind === 'node') {
    const ns = state.nodes[best.def.id];
    if (p.holding) { hud.toast('Hands full — drop with [Q]', 'bad'); audio.play('bad'); return; }
    if (ns.cooldown > 0) { hud.toast('Recharging…', 'bad'); return; }
    if (ns.depleted) { hud.toast('Revival zone — exhausted', 'bad'); return; }
    
    p.holding = baseRes(best.def.id);
    ns.stock = Math.max(0, ns.stock - 1);
    ns.cooldown = 0.5;
    if (ns.stock <= 0) ns.depleted = true;
    audio.play('pickup');
    emitParticles(state, p.x, p.y - 30, { n: 10, color: best.def.glow, speed: 60, life:.5, gravity: -60, size: 2 });
    return;
  }

  if (best.kind === 'machine') {
    const ms = state.machines[best.def.id];
    if (ms.ready && !p.holding) {
      p.holding = ms.output;
      ms.ready = false;
      ms.output = null;
      audio.play('pickup');
      emitParticles(state, p.x, p.y - 35, { n: 12, color: '#ffd87a', speed: 60, life:.5, size: 2 });
      return;
    }
    if (p.holding && !ms.processing && !ms.ready) {
      const want = best.def.recipe;
      const counts = {};
      ms.inputs.forEach(i => counts[i] = (counts[i]||0)+1);
      const wantCounts = {};
      want.forEach(i => wantCounts[i] = (wantCounts[i]||0)+1);
      const held = baseRes(p.holding);
      const hasRoom = (counts[held]||0) < (wantCounts[held]||0);
      if (!hasRoom) {
        if (!wantCounts[held]) hud.toast('Wrong recipe — needs ' + want.map(r=>window.ALL_ITEMS[r].name).join('+'), 'bad');
        else hud.toast(window.ALL_ITEMS[held].name + ' slot is full', 'bad');
        audio.play('bad');
        return;
      }
      ms.inputs.push(held);
      p.holding = null;
      audio.play('insert');
      
      const a = [...ms.inputs].sort();
      const b = [...want].sort();
      if (a.length === b.length && a.every((v,i)=>v===b[i])) {
        ms.processing = true;
        ms.progress = 0;
        audio.play('start');
      }
      return;
    }
    if (ms.processing) hud.toast('Processing… ' + Math.round(ms.progress*100) + '%', 'bad');
    if (p.holding && ms.ready) hud.toast('Output ready — collect first', 'bad');
    return;
  }

  if (best.kind === 'drop') {
    if (p.holding) { hud.toast('Hands full', 'bad'); return; }
    p.holding = best.def.kind;
    state.drops = state.drops.filter(d => d !== best.def);
    audio.play('pickup');
    return;
  }

  if (best.kind === 'board') {
    if (!p.holding) { hud.toast('Carry an item to deliver', 'bad'); return; }
    const held = baseRes(p.holding);
    const match = state.orders.find(o => o.id === held && !o.fulfilled);
    if (!match) { hud.toast('No order matches', 'bad'); audio.play('bad'); return; }
    const def = ORDER_DEFS.find(o => o.id === held);
    const timeBonus = Math.round(def.reward * .5 * (match.timeLeft / match.maxTime));
    const comboMult = 1 + state.combo * 0.2;
    const gained = Math.round((def.reward + timeBonus) * comboMult);
    state.score += gained;
    state.combo = Math.min(9, state.combo + 1);
    state.comboTimer = 8;
    match.fulfilled = true;
    p.holding = null;
    audio.play('deliver');
    hud.scorePop(tilePx(window.BOARD_X), tilePx(window.groundAt(window.BOARD_X)) - 100, '+' + gained);
    state.shake = .35;
    emitParticles(state, tilePx(window.BOARD_X), tilePx(window.groundAt(window.BOARD_X)) - 60,
      { n: 40, color:'#ffd87a', speed: 200, life: 1.2, gravity: 100, upward: 140, size:3 });
    
    setTimeout(() => {
      const idx = state.orders.indexOf(match);
      if (idx >= 0) state.orders.splice(idx, 1);
    }, 400);
  }
}

function tryDrop(state, audio) {
  const p = state.player;
  if (!p.holding) return;
  state.drops.push({
    id: state.nextDropId++,
    kind: p.holding,
    x: p.x + p.facing * 18,
    y: tilePx(window.groundAt(Math.floor(p.x/window.TILE))) - 12,
  });
  p.holding = null;
  audio.play('drop');
}

class Audio {
  constructor() { this.ctx = null; this.muted = false; this.master = null; }
  ensure() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.6;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  beep({ freq=440, dur=.12, type='sine', vol=.15, slide=0, attack=.005, release=.08 }) {
    if (this.muted) return;
    this.ensure();
    const c = this.ctx;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, c.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), c.currentTime + dur);
    g.gain.setValueAtTime(0, c.currentTime);
    g.gain.linearRampToValueAtTime(vol, c.currentTime + attack);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + dur + release);
    o.connect(g); g.connect(this.master);
    o.start();
    o.stop(c.currentTime + dur + release + .02);
  }
  play(name) {
    if (this.muted) return;
    switch (name) {
      case 'pickup': this.beep({freq:880, dur:.07, type:'triangle', vol:.12, slide:240}); break;
      case 'drop':   this.beep({freq:220, dur:.08, type:'sine', vol:.1}); break;
      case 'insert': this.beep({freq:520, dur:.06, type:'square', vol:.07}); break;
      case 'start':  this.beep({freq:180, dur:.18, type:'sawtooth', vol:.08, slide:140}); break;
      case 'done':   this.beep({freq:660, dur:.12, type:'triangle', vol:.14, slide:260});
                     setTimeout(()=>this.beep({freq:990, dur:.18, type:'triangle', vol:.12}), 60); break;
      case 'deliver':this.beep({freq:440, dur:.1, type:'triangle', vol:.14, slide:240});
                     setTimeout(()=>this.beep({freq:880, dur:.14, type:'triangle', vol:.14, slide:240}), 70);
                     setTimeout(()=>this.beep({freq:1320, dur:.22, type:'triangle', vol:.12}), 150); break;
      case 'fail':   this.beep({freq:200, dur:.18, type:'sawtooth', vol:.1, slide:-100}); break;
      case 'bad':    this.beep({freq:140, dur:.06, type:'square', vol:.05}); break;
      case 'jump':   this.beep({freq:330, dur:.05, type:'square', vol:.04, slide:140}); break;
      case 'end':    this.beep({freq:660, dur:.4, type:'triangle', vol:.14, slide:-300}); break;
      case 'menu':   this.beep({freq:400, dur:.06, type:'sine', vol:.08}); break;
      case 'order':  this.beep({freq:520, dur:.06, type:'triangle', vol:.06});
                     setTimeout(()=>this.beep({freq:780, dur:.1, type:'triangle', vol:.06}), 50); break;
    }
  }
}

Object.assign(window, {
  makeInitialState, step, tryInteract, tryDrop, Audio, SESSION_TIME, ORDER_DEFS, baseRes
});

</script>
<script type="text/babel">


const { useEffect, useRef, useState, useCallback } = React;

const TWEAK_DEFAULTS = {
  "particles": 1.0,
  "shake": 1.0,
  "scanlines": true,
  "vignette": true,
  "muted": false,
  "restorationPreview": 0.0,
  "showHints": true,
  "palette": "ember",
  "zoom": 1.0
};

const PALETTES = {
  ember:   { ember:'#ff7a2e', emberHot:'#ffb15a', arc:'#4fd6ff' },
  sapphire:{ ember:'#7a9aff', emberHot:'#a8c0ff', arc:'#ffd87a' },
  rust:    { ember:'#c8552e', emberHot:'#ff8a4a', arc:'#5ab8a8' },
  bone:    { ember:'#d8cfbf', emberHot:'#ffffff', arc:'#a8a090' },
};
function applyPalette(name) {
  const p = PALETTES[name] || PALETTES.ember;
  const r = document.documentElement;
  r.style.setProperty('--ember', p.ember);
  r.style.setProperty('--ember-hot', p.emberHot);
  r.style.setProperty('--arc', p.arc);
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const canvasRef = useRef(null);
  const stateRef = useRef(window.makeInitialState());
  const inputRef = useRef({ left:false, right:false, jump:false, sprint:false });
  const audioRef = useRef(new window.Audio());
  const lastFrameRef = useRef(performance.now());
  const [, force] = useState(0);
  const tick = useCallback(() => force(x => x + 1), []);

  const [scorePops, setScorePops] = useState([]);
  const [toasts, setToasts] = useState([]);
  const [showStart, setShowStart] = useState(true);
  const [showOver, setShowOver] = useState(false);
  const [showHelp, setShowHelp] = useState(false);
  const [interactPrompt, setInteractPrompt] = useState(null);
  const [tutorial, setTutorial] = useState({ stage: 0 });

  useEffect(() => { applyPalette(t.palette); }, [t.palette]);
  useEffect(() => { audioRef.current.muted = t.muted; }, [t.muted]);

  const hud = useRef({
    audio: null,
    toast: (msg, kind) => {
      const id = Math.random().toString(36).slice(2);
      setToasts(ts => [...ts.slice(-3), { id, msg, kind }]);
      setTimeout(() => setToasts(ts => ts.filter(t => t.id !== id)), 2200);
    },
    scorePop: (wx, wy, txt) => {
      const id = Math.random().toString(36).slice(2);
      setScorePops(ps => [...ps, { id, wx, wy, txt }]);
      setTimeout(() => setScorePops(ps => ps.filter(p => p.id !== id)), 1200);
    },
  }).current;
  hud.audio = audioRef.current;

  
  useEffect(() => {
    const down = (e) => {
      const k = e.key.toLowerCase();
      const i = inputRef.current;
      if (k === 'a' || k === 'arrowleft')  { i.left = true; e.preventDefault(); }
      if (k === 'd' || k === 'arrowright') { i.right = true; e.preventDefault(); }
      if (k === 'w' || k === 'arrowup' || k === ' ') { i.jump = true; e.preventDefault(); }
      if (k === 'shift') i.sprint = true;
      if (showStart || showOver) return;
      if (k === 'e') { audioRef.current.ensure(); window.tryInteract(stateRef.current, audioRef.current, hud); }
      if (k === 'q') window.tryDrop(stateRef.current, audioRef.current);
      if (k === 'escape') stateRef.current.paused = !stateRef.current.paused;
      if (k === '?' || k === '/') setShowHelp(s => !s);
    };
    const up = (e) => {
      const k = e.key.toLowerCase();
      const i = inputRef.current;
      if (k === 'a' || k === 'arrowleft')  i.left = false;
      if (k === 'd' || k === 'arrowright') i.right = false;
      if (k === 'w' || k === 'arrowup' || k === ' ') i.jump = false;
      if (k === 'shift') i.sprint = false;
    };
    window.addEventListener('keydown', down);
    window.addEventListener('keyup', up);
    return () => {
      window.removeEventListener('keydown', down);
      window.removeEventListener('keyup', up);
    };
  }, [hud, showStart, showOver]);

  
  
  useEffect(() => {
    const c = canvasRef.current;
    if (!c) return;
    
    
    
    
    const baseTilesX = window.VISIBLE_TILES_X / t.zoom;
    const logicalW = Math.round(baseTilesX * window.TILE);
    const logicalH = 30 * window.TILE; 
    c.width = logicalW;
    c.height = logicalH;

    const fit = () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const scale = Math.min(w / logicalW, h / logicalH);
      const cssW = Math.round(logicalW * scale);
      const cssH = Math.round(logicalH * scale);
      c.style.width = cssW + 'px';
      c.style.height = cssH + 'px';
      c.style.position = 'absolute';
      c.style.left = ((w - cssW) / 2) + 'px';
      c.style.top  = ((h - cssH) / 2) + 'px';
      c.style.imageRendering = 'pixelated';
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, [t.zoom]);

  
  useEffect(() => {
    let raf;
    const frame = (now) => {
      const dt = Math.min(.05, (now - lastFrameRef.current) / 1000);
      lastFrameRef.current = now;
      const s = stateRef.current;
      const canvas = canvasRef.current;
      if (!canvas) { raf = requestAnimationFrame(frame); return; }

      const viewportW = canvas.width;
      const viewportH = canvas.height;
      window.step(s, dt, inputRef.current, audioRef.current, hud, viewportW);

      
      const p = s.player;
      let chosen = null;
      let bestDx = window.tileToPx(2.2);
      const cand = [];
      window.NODE_DEFS.forEach(n => cand.push({ kind:'node', x: window.tileToPx(n.x), def:n }));
      window.MACHINE_DEFS.forEach(m => cand.push({ kind:'machine', x: window.tileToPx(m.x), def:m }));
      cand.push({ kind:'board', x: window.tileToPx(window.BOARD_X) });
      s.drops.forEach(d => cand.push({ kind:'drop', x: d.x, def:d }));
      for (const c of cand) {
        const dx = Math.abs(p.x - c.x);
        if (dx < bestDx) { bestDx = dx; chosen = c; }
      }
      if (chosen && t.showHints && !showStart && !showOver) {
        const ms = chosen.kind === 'machine' ? s.machines[chosen.def.id] : null;
        let label = '';
        if (chosen.kind === 'node') {
          const ns = s.nodes[chosen.def.id];
          if (ns.depleted) label = 'Revival';
          else if (ns.cooldown > 0) label = '· · ·';
          else label = 'Harvest ' + chosen.def.name + '  (' + ns.stock + ')';
        } else if (chosen.kind === 'machine') {
          if (ms.ready) label = 'Collect ' + window.ALL_ITEMS[ms.output].name;
          else if (ms.processing) label = Math.round(ms.progress*100) + '%';
          else if (p.holding) label = 'Insert ' + window.ALL_ITEMS[p.holding].name;
          else {
            const need = chosen.def.recipe.map(r => window.ALL_ITEMS[r].name).join(' + ');
            label = need + ' → ' + window.ALL_ITEMS[chosen.def.output].name;
          }
        } else if (chosen.kind === 'board') {
          label = p.holding ? 'Deliver ' + window.ALL_ITEMS[p.holding].name : 'Order Board';
        } else if (chosen.kind === 'drop') {
          label = 'Pick up ' + window.ALL_ITEMS[chosen.def.kind].name;
        }
        const wx = chosen.x;
        const wy = window.tileToPx(window.groundAt(Math.floor(chosen.x/window.TILE)));
        
        setInteractPrompt({
          xPct: ((wx - s.camX) / viewportW) * 100,
          yPct: ((wy - 160) / viewportH) * 100,
          label,
        });
      } else {
        setInteractPrompt(null);
      }

      
      if (s.started && !s.over) {
        if (tutorial.stage === 0 && p.holding) setTutorial({ stage: 1 });
        else if (tutorial.stage === 1) {
          const inMachine = window.MACHINE_DEFS.some(m => s.machines[m.id].inputs.length > 0 || s.machines[m.id].processing || s.machines[m.id].ready);
          if (inMachine) setTutorial({ stage: 2 });
        } else if (tutorial.stage === 2) {
          if (s.score > 0) setTutorial({ stage: 3 });
        }
      }

      if (s.over && !showOver) setShowOver(true);

      
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      
      if (t.particles < 1.0 && s.particles.length > 0) {
        const cull = Math.floor(s.particles.length * (1 - t.particles));
        for (let i = 0; i < cull; i++) s.particles[i].life = 0;
      }

      const drawState = { ...s, alive: Math.max(s.alive, t.restorationPreview || 0) };
      const shake = (s.shake || 0) * t.shake;
      const sx = shake > 0 ? (Math.random() - .5) * shake * 16 : 0;
      const sy = shake > 0 ? (Math.random() - .5) * shake * 16 : 0;

      ctx.save();
      ctx.translate(sx, sy);
      window.drawWorld(ctx, drawState, now / 1000);
      ctx.restore();

      tick();
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }, [tick, hud, t.particles, t.shake, t.restorationPreview, t.showHints, showStart, showOver, tutorial.stage]);

  const startGame = () => {
    audioRef.current.ensure();
    audioRef.current.play('menu');
    stateRef.current = window.makeInitialState();
    stateRef.current.started = true;
    setShowStart(false);
    setShowOver(false);
    setTutorial({ stage: 0 });
  };
  const restart = () => startGame();

  const s = stateRef.current;
  const minutes = Math.floor(s.timeLeft / 60).toString().padStart(2, '0');
  const seconds = Math.floor(s.timeLeft % 60).toString().padStart(2, '0');

  const grade = (() => {
    const sc = s.score;
    if (sc >= 4000) return 'S';
    if (sc >= 2500) return 'A';
    if (sc >= 1500) return 'B';
    if (sc >= 700)  return 'C';
    if (sc >= 200)  return 'D';
    return 'F';
  })();

  const tutorialMessages = [
    { stage: 0, text: 'Walk right with [D]. Press [E] at a glowing pedestal to harvest.' },
    { stage: 1, text: 'Carry it to a machine. Press [E] to insert. Watch the recipe slots.' },
    { stage: 2, text: 'Once the machine finishes, [E] to collect. Deliver to the Order Board.' },
  ];
  const tipMsg = tutorialMessages.find(m => m.stage === tutorial.stage);

  return (
    <>
      <canvas
        className="world-canvas"
        ref={canvasRef}
        style={{ width:'100vw', height:'100vh' }}
      />

      {t.scanlines && <div className="scanlines"></div>}
      {t.vignette && <div className="vignette"></div>}

      {!showStart && !showOver && (
        <div className="hud">
          <div className="hud-tl">
            <div className="score-wrap">
              <div className="score-label">Wealth</div>
              <div className={"score-val" + (s.score > 0 ? ' pulse' : '')}>{s.score.toLocaleString()}</div>
            </div>
            {s.combo > 0 && (
              <div className="combo">
                ×{(1 + s.combo * 0.2).toFixed(1)} chain
                <span className="combo-bar">
                  <span className="combo-fill" style={{ width: (s.comboTimer / 8 * 100) + '%' }}></span>
                </span>
              </div>
            )}
            <div className="hud-divider"></div>
            <div className="station-row">
              <span>Time</span>
              <span style={{color:'var(--bone)', letterSpacing:'.04em'}}>{minutes}:{seconds}</span>
            </div>
          </div>

          <div className="hud-tr">
            <div className="world-meter">
              <div>World <b>Revival</b></div>
              <div className="meter-bar">
                <div className="meter-fill" style={{ width: Math.max(s.alive, t.restorationPreview) * 100 + '%' }}></div>
                <div className="meter-tick" style={{ left:'25%' }}></div>
                <div className="meter-tick" style={{ left:'50%' }}></div>
                <div className="meter-tick" style={{ left:'75%' }}></div>
              </div>
            </div>
            <div className="orders">
              <div className="orders-label">Orders <span className="dots"><i></i><i></i><i></i></span></div>
              {s.orders.map(o => {
                const def = window.ALL_ITEMS[o.id];
                const odef = window.ORDER_DEFS.find(d => d.id === o.id);
                const urgent = o.timeLeft < o.maxTime * .3;
                return (
                  <div key={o.oid}
                    className={"order" + (urgent ? ' urgent' : '') + (o.entering ? ' entering' : '') + (o.fulfilled ? ' fulfilled' : '')}>
                    <div className="icon" style={{
                      background: 'radial-gradient(circle at 50% 45%, ' + def.glow + ' 0%, ' + def.color + ' 40%, transparent 75%)',
                      boxShadow: '0 0 12px ' + def.color + '88, inset 0 0 8px ' + def.color + '55',
                    }}>
                      <span style={{
                        position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center',
                        color: def.glow, fontSize:14, fontWeight:'bold', textShadow:'0 0 6px '+def.glow,
                      }}>{def.symbol}</span>
                    </div>
                    <div className="meta">
                      <div className="name">{def.name}</div>
                      <div className="reward">+{odef.reward} · ×combo</div>
                    </div>
                    <div className="time">{Math.max(0, Math.ceil(o.timeLeft))}s</div>
                    <div className="timebar"><i style={{ width: Math.max(0, o.timeLeft / o.maxTime * 100) + '%' }}></i></div>
                  </div>
                );
              })}
              {s.orders.length === 0 && (
                <div style={{fontSize:10, color:'var(--bone-dim)', fontStyle:'italic', letterSpacing:'.1em', padding:'6px 4px'}}>
                  awaiting petitioners…
                </div>
              )}
            </div>
          </div>

          <div className="hud-bc">
            <div className={"held" + (s.player.holding ? '' : ' empty')}>
              <div className="swatch" style={ s.player.holding ? {
                background: 'radial-gradient(circle at 50% 50%, ' + window.ALL_ITEMS[s.player.holding].glow + ' 0%, ' + window.ALL_ITEMS[s.player.holding].color + ' 40%, transparent 80%)',
                boxShadow: '0 0 16px ' + window.ALL_ITEMS[s.player.holding].color + '99',
                border: '.5px solid ' + window.ALL_ITEMS[s.player.holding].glow,
              } : {} }>
                {s.player.holding && (
                  <span style={{
                    position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center',
                    color: window.ALL_ITEMS[s.player.holding].glow,
                    fontSize:12, fontWeight:'bold', textShadow:'0 0 6px '+window.ALL_ITEMS[s.player.holding].glow
                  }}>{window.ALL_ITEMS[s.player.holding].symbol}</span>
                )}
              </div>
              <span className="name">
                {s.player.holding ? window.ALL_ITEMS[s.player.holding].name : 'Empty Hands'}
              </span>
              <span className="keys">[<span className="kbd">Q</span> drop]</span>
            </div>
          </div>

          <div className="hud-br">
            <div className="station-row">
              <span className="kbd">A</span><span className="kbd">D</span>
              <span style={{paddingTop:2}}>Move</span>
            </div>
            <div className="station-row">
              <span className="kbd">W</span>
              <span style={{paddingTop:2}}>Jump</span>
            </div>
            <div className="station-row">
              <span className="kbd">E</span>
              <span style={{paddingTop:2}}>Interact</span>
            </div>
            <div className="station-row">
              <span className="kbd">?</span>
              <span style={{paddingTop:2}}>Recipes</span>
            </div>
          </div>

          {interactPrompt && (
            <div className="prompt" style={{
              left: interactPrompt.xPct + '%',
              top:  interactPrompt.yPct + '%',
            }}>
              <span className="kbd">E</span>
              <span>{interactPrompt.label}</span>
            </div>
          )}

          {tipMsg && t.showHints && (
            <div className="tutorial" style={{
              left: '50%', transform:'translateX(-50%)',
              bottom: 96,
            }}>
              {tipMsg.text}
            </div>
          )}

          <div className="toaster">
            {toasts.map(t => <div key={t.id} className={"toast " + (t.kind || '')}>{t.msg}</div>)}
          </div>

          {scorePops.map(p => (
            <div key={p.id} className="score-pop" style={{
              left: ((p.wx - s.camX) / (canvasRef.current?.width || 1920)) * 100 + '%',
              top:  (p.wy / (canvasRef.current?.height || 1080)) * 100 + '%',
            }}>{p.txt}</div>
          ))}

          {s.paused && (
            <div className="gover" style={{background:'rgba(0,0,0,.6)'}}>
              <div className="gover-title">Paused</div>
              <button className="btn-primary" onClick={() => stateRef.current.paused = false}>Resume</button>
            </div>
          )}
        </div>
      )}

      {showHelp && !showStart && !showOver && (
        <div className="gover" onClick={() => setShowHelp(false)} style={{cursor:'pointer'}}>
          <div className="gover-title">Recipes</div>
          <div style={{display:'flex',flexDirection:'column',gap:10,fontSize:13,color:'var(--bone)',fontFamily:'var(--hud-mono)',letterSpacing:'.06em'}}>
            {window.MACHINE_DEFS.map(m => (
              <div key={m.id} style={{display:'flex',alignItems:'center',gap:14}}>
                <span style={{color:'var(--bone-dim)',width:120,textAlign:'right'}}>{m.name}</span>
                <span>{m.recipe.map(r => window.ALL_ITEMS[r].name).join(' + ')}</span>
                <span style={{color:'var(--bone-dim)'}}>→</span>
                <span style={{color:'var(--ember-hot)'}}>{window.ALL_ITEMS[m.output].name}</span>
              </div>
            ))}
          </div>
          <div style={{fontSize:10,color:'var(--bone-dim)',letterSpacing:'.2em',textTransform:'uppercase',marginTop:18}}>click anywhere to dismiss</div>
        </div>
      )}

      {showStart && <StartScreen onStart={startGame} onHelp={() => setShowHelp(true)} />}
      {showOver && <GameOver score={s.score} grade={grade} onRestart={restart} />}

      <TweaksPanel>
        <TweakSection label="Atmosphere" />
        <TweakRadio label="Palette" value={t.palette}
          options={['ember','sapphire','rust','bone']}
          onChange={(v) => setTweak('palette', v)} />
        <TweakSlider label="Restoration preview" value={t.restorationPreview}
          min={0} max={1} step={.05} unit=""
          onChange={(v) => setTweak('restorationPreview', v)} />
        <TweakToggle label="Scanlines" value={t.scanlines}
          onChange={(v) => setTweak('scanlines', v)} />
        <TweakToggle label="Vignette" value={t.vignette}
          onChange={(v) => setTweak('vignette', v)} />

        <TweakSection label="Game feel" />
        <TweakSlider label="Particle density" value={t.particles}
          min={0} max={2} step={.1} unit="×"
          onChange={(v) => setTweak('particles', v)} />
        <TweakSlider label="Screen shake" value={t.shake}
          min={0} max={2} step={.1} unit="×"
          onChange={(v) => setTweak('shake', v)} />
        <TweakSlider label="Camera zoom" value={t.zoom}
          min={0.6} max={1.6} step={.1} unit="×"
          onChange={(v) => setTweak('zoom', v)} />
        <TweakToggle label="Show hints" value={t.showHints}
          onChange={(v) => setTweak('showHints', v)} />
        <TweakToggle label="Mute audio" value={t.muted}
          onChange={(v) => setTweak('muted', v)} />

        <TweakSection label="Session" />
        <TweakButton label="Restart" onClick={restart} />
      </TweaksPanel>
    </>
  );
}

function StartScreen({ onStart, onHelp }) {
  return (
    <div className="start">
      <div className="start-sub">An Alchemical · <b>Restoration</b> · Sandbox</div>
      <div className="start-title">Revival<em>.</em></div>
      <div className="start-tag">
        The world has gone quiet. Harvest what's left, build the engines,<br/>
        and coax the machine-god back to life — one cracked acre at a time.
      </div>
      <div className="start-cta">
        <button className="btn-primary" onClick={onStart}>Begin the Vigil</button>
        <button className="btn-ghost" onClick={onHelp}>View Recipes</button>
        <div className="start-keys">
          <span><span className="kbd">A</span><span className="kbd">D</span> move</span>
          <span><span className="kbd">W</span> jump</span>
          <span><span className="kbd">⇧</span> sprint</span>
          <span><span className="kbd">E</span> interact</span>
          <span><span className="kbd">Q</span> drop</span>
          <span><span className="kbd">?</span> recipes</span>
        </div>
      </div>
    </div>
  );
}

function GameOver({ score, grade, onRestart }) {
  return (
    <div className="gover">
      <div className="gover-title">The vigil ends.</div>
      <div className="gover-grade">{grade}</div>
      <div className="gover-stats">
        <span>Final wealth</span><b>{score.toLocaleString()}</b>
        <span>Status</span><b>{grade === 'S' ? 'Restored' : grade === 'F' ? 'Forsaken' : 'Stirring'}</b>
      </div>
      <div className="gover-cta">
        <button className="btn-primary" onClick={onRestart}>Begin Again</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
