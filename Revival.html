<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revival — Factory Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --ink: #07080a;
  --ash: #14161b;
  --ash-2: #1c1f26;
  --bone: #d8cfbf;
  --bone-dim: #8a8273;
  --ember: #ff7a2e;
  --ember-hot: #ffb15a;
  --arc: #4fd6ff;
  --arc-hot: #a8f0ff;
  --rot: #6b7d4a;
  --blood: #b54a3a;

  --hud-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --display: 'Cormorant Garamond', 'Cormorant', 'Times New Roman', serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#000;color:var(--bone);
  font-family:var(--hud-mono);
  -webkit-font-smoothing:antialiased;
  image-rendering: pixelated;
  user-select:none;
}

#root{width:100vw;height:100vh;position:relative;overflow:hidden}


.world-canvas{
  position:absolute;inset:0;width:100%;height:100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}


.scanlines{
  position:absolute;inset:0;pointer-events:none;z-index:50;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.18) 3px,
      rgba(0,0,0,.18) 3px
    );
  mix-blend-mode: multiply;
  opacity:.55;
}
.vignette{
  position:absolute;inset:0;pointer-events:none;z-index:51;
  background:
    radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.55) 95%),
    radial-gradient(ellipse at center, transparent 70%, rgba(0,0,0,.35) 100%);
}


.hud{
  position:absolute;inset:0;pointer-events:none;z-index:40;
  font-family:var(--hud-mono);
  color:var(--bone);
}
.hud > *{pointer-events:auto}

.hud-tl{
  position:absolute;top:18px;left:20px;
  display:flex;flex-direction:column;gap:8px;
}
.hud-tr{
  position:absolute;top:18px;right:20px;
  display:flex;flex-direction:column;gap:10px;align-items:flex-end;
}
.hud-bl{
  position:absolute;bottom:18px;left:20px;
  display:flex;flex-direction:column;gap:10px;
}
.hud-bc{
  position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  display:flex;gap:10px;align-items:center;
}
.hud-br{
  position:absolute;bottom:18px;right:20px;
  display:flex;flex-direction:column;gap:6px;align-items:flex-end;
}


.score-wrap{display:flex;flex-direction:column;gap:2px}
.score-label{
  font-size:9px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--bone-dim);
}
.score-val{
  font-size:34px;line-height:1;font-weight:600;letter-spacing:-.02em;
  color:var(--bone);
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px rgba(255,122,46,.0);
  transition:text-shadow .3s, color .2s;
}
.score-val.pulse{
  color:var(--ember-hot);
  text-shadow:0 0 16px rgba(255,177,90,.6);
}
.combo{
  font-size:11px;letter-spacing:.1em;
  color:var(--ember);
  display:flex;align-items:center;gap:6px;
}
.combo-bar{
  width:120px;height:3px;background:rgba(255,122,46,.15);overflow:hidden;
  border:.5px solid rgba(255,122,46,.3);
}
.combo-fill{
  height:100%;background:var(--ember);
  box-shadow:0 0 8px var(--ember);
  transition:width .15s linear;
}


.world-meter{
  display:flex;flex-direction:column;gap:4px;align-items:flex-end;
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--bone-dim);
}
.world-meter b{
  font-weight:500;color:var(--bone);letter-spacing:.06em;text-transform:none;
  font-size:11px;
}
.meter-bar{
  width:200px;height:6px;background:rgba(216,207,191,.06);
  border:.5px solid rgba(216,207,191,.18);
  position:relative;overflow:hidden;
}
.meter-fill{
  height:100%;
  background:linear-gradient(90deg, var(--rot), #aac08a);
  box-shadow:0 0 8px rgba(170,192,138,.5);
  transition:width .4s ease;
}
.meter-tick{
  position:absolute;top:-2px;bottom:-2px;width:1px;
  background:rgba(216,207,191,.35);
}


.held{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px 8px 8px;
  background:rgba(7,8,10,.72);
  border:.5px solid rgba(216,207,191,.15);
  border-radius:2px;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--bone-dim);
  min-width:140px;
  backdrop-filter:blur(8px);
}
.held.empty{opacity:.55}
.held .swatch{
  width:22px;height:22px;border-radius:1px;
  position:relative;flex-shrink:0;
  background:rgba(216,207,191,.05);
  border:.5px dashed rgba(216,207,191,.2);
}
.held .name{color:var(--bone);font-size:11px;letter-spacing:.04em}
.held .keys{
  margin-left:auto;font-size:9px;color:var(--bone-dim);
  letter-spacing:.12em;
}


.kbd{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;padding:0 5px;
  border:.5px solid rgba(216,207,191,.45);
  background:rgba(216,207,191,.06);
  font-family:var(--hud-mono);font-size:9px;
  color:var(--bone);letter-spacing:.04em;
  border-radius:2px;
}

.prompt{
  position:absolute;display:flex;align-items:center;gap:8px;
  background:rgba(7,8,10,.85);
  border:.5px solid rgba(255,177,90,.45);
  padding:6px 10px;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--bone);
  pointer-events:none;
  white-space:nowrap;
  transform:translate(-50%, -100%);
  z-index:30;
  box-shadow:0 0 24px rgba(255,122,46,.25);
  animation:promptFloat 1.6s ease-in-out infinite;
}
@keyframes promptFloat{
  0%,100%{transform:translate(-50%, -100%)}
  50%{transform:translate(-50%, calc(-100% - 4px))}
}


.orders{
  display:flex;flex-direction:column;gap:6px;align-items:flex-end;
}
.orders-label{
  font-size:9px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--bone-dim);margin-bottom:2px;
}
.order{
  display:flex;align-items:center;gap:12px;
  padding:8px 10px 8px 8px;
  background:rgba(7,8,10,.78);
  border-left:2px solid var(--bone-dim);
  border-top:.5px solid rgba(216,207,191,.08);
  border-right:.5px solid rgba(216,207,191,.08);
  border-bottom:.5px solid rgba(216,207,191,.08);
  min-width:240px;
  backdrop-filter:blur(6px);
  position:relative;overflow:hidden;
}
.order .icon{
  width:28px;height:28px;flex-shrink:0;position:relative;
  border:.5px solid rgba(216,207,191,.2);
  background:rgba(216,207,191,.04);
}
.order .meta{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.order .name{
  font-size:11px;letter-spacing:.06em;color:var(--bone);
  text-transform:uppercase;
}
.order .reward{
  font-size:9px;letter-spacing:.16em;color:var(--ember);
}
.order .time{
  font-size:11px;font-variant-numeric:tabular-nums;
  color:var(--bone-dim);letter-spacing:.04em;
}
.order .timebar{
  position:absolute;left:0;right:0;bottom:0;height:2px;
  background:rgba(216,207,191,.06);
}
.order .timebar i{
  display:block;height:100%;background:var(--bone);
  transition:width .2s linear;
}
.order.urgent{border-left-color:var(--ember)}
.order.urgent .timebar i{background:var(--ember);box-shadow:0 0 6px var(--ember)}
.order.urgent .time{color:var(--ember-hot)}
.order.entering{animation:orderIn .35s cubic-bezier(.2,.8,.3,1)}
.order.exiting{animation:orderOut .28s ease-in forwards}
.order.fulfilled{animation:orderDone .55s ease-out forwards}
@keyframes orderIn{
  from{transform:translateX(40px);opacity:0}
  to{transform:translateX(0);opacity:1}
}
@keyframes orderOut{
  to{transform:translateX(40px);opacity:0;filter:blur(2px)}
}
@keyframes orderDone{
  0%{background:rgba(255,177,90,.28);border-left-color:var(--ember-hot)}
  100%{transform:translateX(40px);opacity:0}
}


.toaster{
  position:absolute;left:50%;top:80px;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:4px;align-items:center;
  pointer-events:none;z-index:45;
}
.toast{
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  padding:5px 12px;
  background:rgba(7,8,10,.85);
  border:.5px solid rgba(216,207,191,.2);
  color:var(--bone);
  animation:toastIn .35s ease-out, toastOut .4s ease-in 1.6s forwards;
}
.toast.good{border-color:var(--ember);color:var(--ember-hot)}
.toast.bad{border-color:var(--blood);color:#e88}
@keyframes toastIn{from{transform:translateY(-12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes toastOut{to{transform:translateY(-8px);opacity:0}}


.score-pop{
  position:absolute;font-family:var(--hud-mono);
  font-size:14px;font-weight:600;color:var(--ember-hot);
  text-shadow:0 0 12px rgba(255,177,90,.6);
  pointer-events:none;
  animation:scorePop 1.1s ease-out forwards;
  z-index:25;
  letter-spacing:.04em;
}
@keyframes scorePop{
  0%{transform:translate(-50%,0);opacity:0}
  20%{opacity:1}
  100%{transform:translate(-50%,-44px);opacity:0}
}


.start{
  position:absolute;inset:0;z-index:80;
  background:radial-gradient(ellipse at center, #0c0d10 0%, #000 80%);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:36px;
  animation:startFade .8s ease-out;
}
@keyframes startFade{from{opacity:0}to{opacity:1}}
.start-mark{
  width:120px;height:120px;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.start-title{
  font-family:var(--display);
  font-size:108px;font-weight:300;
  letter-spacing:.04em;color:var(--bone);
  line-height:.9;
  text-shadow:0 0 32px rgba(255,122,46,.18);
}
.start-title em{
  font-style:italic;font-weight:400;
  color:var(--ember);
  text-shadow:0 0 24px rgba(255,122,46,.55);
}
.start-sub{
  font-family:var(--hud-mono);
  font-size:11px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--bone-dim);
}
.start-sub b{color:var(--bone);font-weight:400}
.start-tag{
  font-family:var(--display);
  font-style:italic;
  font-size:18px;color:var(--bone-dim);
  max-width:520px;text-align:center;line-height:1.4;
}
.start-cta{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  margin-top:20px;
}
.btn-primary{
  appearance:none;border:0;background:transparent;
  font-family:var(--hud-mono);
  font-size:12px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--bone);
  padding:14px 36px;
  border:.5px solid var(--bone);
  cursor:pointer;
  transition:all .25s;
  position:relative;
}
.btn-primary:hover{
  color:var(--ink);background:var(--bone);
  box-shadow:0 0 32px rgba(216,207,191,.35);
  letter-spacing:.4em;
}
.btn-ghost{
  appearance:none;border:0;background:transparent;
  font-family:var(--hud-mono);
  font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--bone-dim);cursor:pointer;
  padding:6px 12px;
  transition:color .2s;
}
.btn-ghost:hover{color:var(--bone)}

.start-keys{
  display:flex;gap:18px;margin-top:8px;
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--bone-dim);
}
.start-keys span{display:inline-flex;align-items:center;gap:6px}


.gover{
  position:absolute;inset:0;z-index:80;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:18px;
  animation:startFade .6s ease-out;
}
.gover-grade{
  font-family:var(--display);
  font-size:200px;line-height:.85;font-weight:300;font-style:italic;
  color:var(--ember);
  text-shadow:0 0 56px rgba(255,122,46,.55);
}
.gover-title{
  font-family:var(--display);font-size:32px;font-style:italic;
  color:var(--bone);
}
.gover-stats{
  display:grid;grid-template-columns:auto auto;gap:6px 36px;
  font-family:var(--hud-mono);font-size:11px;letter-spacing:.06em;
  color:var(--bone-dim);
  margin:8px 0 24px;
}
.gover-stats b{color:var(--bone);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.gover-cta{display:flex;gap:14px}


.tutorial{
  position:absolute;z-index:42;
  background:rgba(7,8,10,.92);
  border:.5px solid var(--ember);
  padding:10px 14px;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--bone);
  max-width:280px;line-height:1.6;
  box-shadow:0 0 32px rgba(255,122,46,.25);
  pointer-events:none;
}
.tutorial::before{
  content:'';position:absolute;
  width:8px;height:8px;background:inherit;border:inherit;
  transform:rotate(45deg);
  border-right:0;border-top:0;
}
.tutorial.left::before{left:-5px;top:14px}
.tutorial.bottom::before{bottom:-5px;left:50%;margin-left:-4px;border-bottom:0;border-left:0;border-right:.5px solid var(--ember);border-top:.5px solid var(--ember)}


.hud-divider{
  width:100%;height:1px;background:rgba(216,207,191,.08);margin:4px 0;
}


.dots{display:inline-block}
.dots i{display:inline-block;width:3px;height:3px;background:currentColor;margin:0 1px;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}


.station-row{
  display:flex;gap:6px;
  font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--bone-dim);
}


.shake{animation:shake .35s}
@keyframes shake{
  10%,90%{transform:translate(-1px,0)}
  20%,80%{transform:translate(2px,-1px)}
  30%,50%,70%{transform:translate(-3px,1px)}
  40%,60%{transform:translate(3px,1px)}
}

</style>
</head>

  .twk-btn{appearance:none;height:26px;padding:0 12px;border:0;border-radius:7px;
    background:rgba(0,0,0,.78);color:#fff;font:inherit;font-weight:500;cursor:default}
  .twk-btn:hover{background:rgba(0,0,0,.88)}
  .twk-btn.secondary{background:rgba(0,0,0,.06);color:inherit}
  .twk-btn.secondary:hover{background:rgba(0,0,0,.1)}

  .twk-swatch{appearance:none;-webkit-appearance:none;width:56px;height:22px;
    border:.5px solid rgba(0,0,0,.1);border-radius:6px;padding:0;cursor:default;
    background:transparent;flex-shrink:0}
  .twk-swatch::-webkit-color-swatch-wrapper{padding:0}
  .twk-swatch::-webkit-color-swatch{border:0;border-radius:5.5px}
  .twk-swatch::-moz-color-swatch{border:0;border-radius:5.5px}
`;




function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  
  
  
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}








function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}



function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}



function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  
  
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel">




const TILE = 16;              
const WORLD_W = 240;          
const GROUND_Y = 22;          
const VISIBLE_TILES_X = 36;   


function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

function makeHeightmap(seed = 7) {
  const rng = mulberry32(seed);
  const h = new Array(WORLD_W);
  for (let x = 0; x < WORLD_W; x++) {
    const noise = Math.sin(x * 0.16) * 1.0 + Math.sin(x * 0.07 + 1.3) * 1.6 + (rng() - .5) * .5;
    h[x] = Math.max(GROUND_Y - 2, Math.min(GROUND_Y + 3, GROUND_Y + Math.round(noise)));
  }
  
  for (let x = 40; x < 55; x++) h[x] = GROUND_Y + 2;
  for (let x = 145; x < 160; x++) h[x] = GROUND_Y + 3;
  
  const flatten = (cx, w=4) => { for (let i=cx-w;i<=cx+w;i++) h[i] = GROUND_Y; };
  
  [16, 50, 86, 122, 162, 198].forEach(x => flatten(x, 3));
  
  [32, 68, 104, 140, 178, 220].forEach(x => flatten(x, 4));
  return h;
}



const NODE_DEFS = [
  { id:'ember', name:'Ember', x: 16,  color:'#ff7a2e', glow:'#ffb15a', symbol:'△' },
  { id:'silt',  name:'Silt',  x: 50,  color:'#a37a4a', glow:'#dcb280', symbol:'◇' },
  { id:'frost', name:'Frost', x: 86,  color:'#4fd6ff', glow:'#a8f0ff', symbol:'○' },
  { id:'silt2', name:'Silt',  x: 122, color:'#a37a4a', glow:'#dcb280', symbol:'◇' },
  { id:'bone',  name:'Bone',  x: 162, color:'#e0d6c4', glow:'#ffffff', symbol:'✕' },
  { id:'sap',   name:'Sap',   x: 198, color:'#a3b06b', glow:'#d8e29a', symbol:'❋' },
];


const NODE_TO_RES = { ember:'ember', silt:'silt', silt2:'silt', frost:'frost', bone:'bone', sap:'sap' };


const MACHINE_DEFS = [
  { id:'M1', kind:'Crucible',  x: 32,  recipe:['ember','silt'],   output:'cinder',  name:'Crucible',  duration: 3.5 },
  { id:'M2', kind:'Condenser', x: 68,  recipe:['frost','silt'],   output:'mire',    name:'Condenser', duration: 4.0 },
  { id:'M3', kind:'Loom',      x: 104, recipe:['cinder','bone'],  output:'rune',    name:'Rune Loom', duration: 5.0 },
  { id:'M4', kind:'Forge',     x: 140, recipe:['mire','rune'],    output:'core',    name:'God Forge', duration: 7.0 },
  { id:'M5', kind:'Crucible',  x: 178, recipe:['ember','sap'],    output:'cinder',  name:'Crucible',  duration: 3.5 },
];

const PRODUCT_DEFS = {
  cinder: { name:'Cinder',   color:'#ff5a1f', glow:'#ffa85c', symbol:'▲' },
  mire:   { name:'Mire',     color:'#5b8c6a', glow:'#a8e8c0', symbol:'◆' },
  rune:   { name:'Rune',     color:'#caa4ff', glow:'#e4cfff', symbol:'⬢' },
  core:   { name:'God-Core', color:'#ffd87a', glow:'#fff2c2', symbol:'✦' },
};

const ALL_ITEMS = (() => {
  const items = {};
  NODE_DEFS.forEach(n => items[n.id] = { name:n.name, color:n.color, glow:n.glow, symbol:n.symbol, base: NODE_TO_RES[n.id] });
  
  ['ember','silt','frost','bone','sap'].forEach(r => {
    const n = NODE_DEFS.find(d => NODE_TO_RES[d.id] === r);
    items[r] = { name:n.name, color:n.color, glow:n.glow, symbol:n.symbol, base: r };
  });
  Object.entries(PRODUCT_DEFS).forEach(([k,v]) => items[k] = { ...v, base: k });
  return items;
})();

const BOARD_X = 220;

let __heightmap = null;
function getHeightmap() {
  if (!__heightmap) __heightmap = makeHeightmap(7);
  return __heightmap;
}
function groundAt(x) {
  const hm = getHeightmap();
  const xi = Math.max(0, Math.min(WORLD_W - 1, Math.floor(x)));
  return hm[xi];
}

function lerpHex(a, b, t) {
  t = Math.max(0, Math.min(1, t));
  const ah = parseInt(a.slice(1), 16), bh = parseInt(b.slice(1), 16);
  const ar=(ah>>16)&255, ag=(ah>>8)&255, ab=ah&255;
  const br=(bh>>16)&255, bg=(bh>>8)&255, bb=bh&255;
  const r=Math.round(ar+(br-ar)*t), g=Math.round(ag+(bg-ag)*t), bl=Math.round(ab+(bb-ab)*t);
  return '#' + ((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1);
}


function tileToPx(t) { return t * TILE; }


function drawWorld(ctx, state, t) {
  const W = ctx.canvas.width;
  const H = ctx.canvas.height;
  const camX = state.camX;
  const alive = state.alive;

  drawSky(ctx, W, H, alive);
  drawStars(ctx, W, H, t, alive);
  drawMountains(ctx, camX*0.15, W, H, '#0a0d12', H*0.55, 1.0, alive);
  drawMountains(ctx, camX*0.35, W, H, '#13171f', H*0.62, 0.8, alive);
  drawMountains(ctx, camX*0.55, W, H, '#1a1f29', H*0.68, 0.55, alive);
  drawHaze(ctx, W, H, t, alive);
  drawGround(ctx, camX, W, H, alive, t);

  
  drawShrine(ctx, camX, H, alive, t);

  
  for (const n of NODE_DEFS) drawNode(ctx, n, camX, t, state);

  
  for (const m of MACHINE_DEFS) drawMachine(ctx, m, camX, t, state);

  
  drawOrderBoard(ctx, camX, t, state);

  
  for (const d of state.drops) drawDrop(ctx, d, camX, t);

  
  for (const p of state.particles) drawParticle(ctx, p, camX);

  
  drawPlayer(ctx, state.player, camX, t);

  
  drawForegroundDust(ctx, W, H, t);
}

function drawSky(ctx, W, H, alive) {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0,    lerpHex('#05060a', '#0c1018', alive*.6));
  sky.addColorStop(.45,  lerpHex('#0b0d12', '#1a2230', alive*.6));
  sky.addColorStop(.78,  lerpHex('#1a1208', '#3a2818', alive*.5));
  sky.addColorStop(1,    lerpHex('#180b06', '#2a1a0c', alive*.5));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);
}

function drawStars(ctx, W, H, t, alive) {
  ctx.save();
  const seed = mulberry32(99);
  for (let i = 0; i < 130; i++) {
    const sx = Math.floor(seed() * W);
    const sy = Math.floor(seed() * (H * 0.5));
    const tw = .25 + seed() * .65;
    const flick = .55 + Math.sin(t * 1.2 + i) * .25;
    ctx.globalAlpha = tw * flick * (1 - alive*.4);
    ctx.fillStyle = '#cdd6df';
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.restore();
}

function drawMountains(ctx, scrollX, W, H, color, baseY, alpha, alive) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, H);
  const off = scrollX % 600;
  for (let x = -off; x < W + 600; x += 8) {
    const n = Math.sin(x * .008 + baseY) * 36 + Math.sin(x * .025 + baseY*0.3) * 16;
    ctx.lineTo(x, baseY + n);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawHaze(ctx, W, H, t, alive) {
  ctx.save();
  ctx.globalAlpha = .14 * (1 - alive*.4);
  ctx.fillStyle = '#3a2818';
  for (let i = 0; i < 5; i++) {
    const y = H * 0.5 + i * 26;
    const off = (t * (12 + i*4)) % (W + 400) - 200;
    for (let x = 0; x < W + 200; x += 140) {
      ctx.beginPath();
      ctx.ellipse(x - off, y, 110, 9, 0, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawGround(ctx, camX, W, H, alive, t) {
  const startTile = Math.floor(camX / TILE) - 1;
  const endTile = startTile + Math.ceil(W / TILE) + 2;
  const hm = getHeightmap();
  for (let x = startTile; x < endTile; x++) {
    if (x < 0 || x >= WORLD_W) continue;
    const gy = hm[x];
    const sx = x * TILE - camX;
    const sy = gy * TILE;
    
    const crust = lerpHex('#3a342a', '#5e6e3e', alive);
    ctx.fillStyle = crust;
    ctx.fillRect(sx, sy, TILE, 4);
    ctx.fillStyle = lerpHex('#2a241c', '#46522e', alive);
    ctx.fillRect(sx, sy + 4, TILE, 2);
    
    ctx.fillStyle = lerpHex('#1a1612', '#2a221a', alive*.4);
    ctx.fillRect(sx, sy + 6, TILE, H - sy - 6);
    
    const seed = mulberry32(x * 37 + 1);
    for (let y = sy + 8; y < H; y += 4) {
      if (seed() < .12) {
        ctx.fillStyle = lerpHex('#0e0b09', '#1f1610', alive*.4);
        ctx.fillRect(sx, y, TILE, 1);
      }
    }
    
    const ck = mulberry32(x * 91 + 5);
    if (ck() < .35 - alive*.3) {
      ctx.fillStyle = '#0b0a08';
      ctx.fillRect(sx + Math.floor(ck()*TILE), sy + 4, 1, 4);
    }
    
    if (alive > .2 && ck() < alive * .55) {
      ctx.fillStyle = lerpHex('#3a4a22', '#7a9a3a', alive);
      ctx.fillRect(sx + 3, sy - 2, 2, 2);
      if (ck() < alive * .6) ctx.fillRect(sx + 9, sy - 3, 2, 3);
    }
  }
}

function drawShrine(ctx, camX, H, alive, t) {
  
  const shrineX = tileToPx(110); 
  const sx = shrineX - camX * 0.4;
  if (sx < -200 || sx > ctx.canvas.width + 200) return;
  const baseY = H * 0.62;
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#0a0c12';
  
  ctx.fillRect(sx - 14, baseY - 60, 28, 60);
  ctx.fillRect(sx - 24, baseY - 32, 48, 32);
  ctx.fillRect(sx - 18, baseY - 78, 36, 18);
  
  ctx.fillRect(sx - 4, baseY - 90, 8, 12);
  ctx.restore();
  
  if (alive > 0.05) {
    const a = Math.min(1, alive*1.5);
    const flick = .8 + Math.sin(t*4)*.2;
    ctx.fillStyle = `rgba(255,177,90,${a*flick*.9})`;
    ctx.fillRect(sx - 3, baseY - 70, 6, 4);
    const grd = ctx.createRadialGradient(sx, baseY - 68, 0, sx, baseY - 68, 60);
    grd.addColorStop(0, `rgba(255,177,90,${a*.5})`);
    grd.addColorStop(1, 'rgba(255,177,90,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(sx - 60, baseY - 128, 120, 120);
  }
}


function drawNode(ctx, n, camX, t, state) {
  const wx = tileToPx(n.x);
  const sx = wx - camX;
  if (sx < -80 || sx > ctx.canvas.width + 80) return;
  const gy = groundAt(n.x) * TILE;
  const ns = state.nodes[n.id] || {};
  const depleted = ns.depleted;
  const cooldown = ns.cooldown || 0;

  
  ctx.fillStyle = '#1a1612';
  ctx.fillRect(sx - 14, gy - 12, 32, 12);
  ctx.fillStyle = '#2a221a';
  ctx.fillRect(sx - 14, gy - 12, 32, 2);
  ctx.fillStyle = '#0a0807';
  ctx.fillRect(sx - 14, gy - 2, 32, 2);
  
  const pulse = .55 + Math.sin(t*2 + n.x)*.25;
  if (!depleted) {
    ctx.fillStyle = n.glow;
    ctx.globalAlpha = pulse * .65;
    ctx.fillRect(sx - 8, gy - 7, 16, 2);
    ctx.fillRect(sx - 5, gy - 10, 10, 1);
    ctx.globalAlpha = 1;
  }
  
  if (!depleted && cooldown <= 0) {
    const bob = Math.sin(t * 2.4 + n.x) * 3;
    drawGlowDot(ctx, sx + 1, gy - 30 + bob, n.color, n.glow, 8 + Math.sin(t*3+n.x)*1);
    ctx.fillStyle = n.glow;
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.globalAlpha = .9;
    ctx.fillText(n.symbol, sx + 1, gy - 26 + bob);
    ctx.globalAlpha = 1;
  }
  
  if (!depleted) {
    const grd = ctx.createRadialGradient(sx, gy - 8, 4, sx, gy - 8, 60);
    grd.addColorStop(0, n.color + 'aa');
    grd.addColorStop(1, n.color + '00');
    ctx.fillStyle = grd;
    ctx.globalAlpha = .35 + pulse*.2;
    ctx.fillRect(sx - 60, gy - 70, 120, 80);
    ctx.globalAlpha = 1;
  }
  
  if (!depleted) {
    for (let i = 0; i < ns.stock; i++) {
      ctx.fillStyle = i < 3 ? '#3a342a' : (i < 8 ? n.color : n.glow);
      ctx.fillRect(sx - 12 + i*2, gy + 1, 1, 2);
    }
  }
}

function drawGlowDot(ctx, x, y, color, glow, r) {
  const grd = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
  grd.addColorStop(0, glow + 'cc');
  grd.addColorStop(.4, color + '99');
  grd.addColorStop(1, color + '00');
  ctx.fillStyle = grd;
  ctx.fillRect(x - r*3, y - r*3, r*6, r*6);
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(x, y, r*0.6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r*0.3, 0, Math.PI*2); ctx.fill();
}

function drawMachine(ctx, m, camX, t, state) {
  const wx = tileToPx(m.x);
  const sx = wx - camX;
  if (sx < -120 || sx > ctx.canvas.width + 120) return;
  const gy = groundAt(m.x) * TILE;
  const ms = state.machines[m.id] || {};

  if (m.kind === 'Crucible') drawCrucible(ctx, sx, gy, t, ms, m);
  else if (m.kind === 'Condenser') drawCondenser(ctx, sx, gy, t, ms, m);
  else if (m.kind === 'Loom') drawLoom(ctx, sx, gy, t, ms, m);
  else if (m.kind === 'Forge') drawForge(ctx, sx, gy, t, ms, m);

  
  const want = m.recipe;
  const slotsY = gy - 80;
  const slotW = 16;
  const totalW = want.length * slotW + (want.length-1) * 4;
  const startX = sx - totalW/2 + slotW/2;
  
  const inputs = ms.inputs || [];
  const counts = {};
  inputs.forEach(i => counts[i] = (counts[i]||0)+1);
  const used = {};
  for (let i = 0; i < want.length; i++) {
    const r = want[i];
    used[r] = (used[r]||0);
    const isFilled = used[r] < (counts[r]||0);
    if (isFilled) used[r]++;
    const slotX = startX + i * (slotW + 4);
    
    ctx.fillStyle = '#0a0908';
    ctx.fillRect(slotX - slotW/2, slotsY, slotW, slotW);
    ctx.strokeStyle = isFilled ? window.ALL_ITEMS[r].glow : '#3a342a';
    ctx.lineWidth = 1;
    ctx.strokeRect(slotX - slotW/2 + .5, slotsY + .5, slotW - 1, slotW - 1);
    if (isFilled) {
      const def = window.ALL_ITEMS[r];
      drawGlowDot(ctx, slotX, slotsY + slotW/2, def.color, def.glow, 4);
      ctx.fillStyle = def.glow;
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(def.symbol, slotX, slotsY + slotW/2 + 3);
    } else {
      
      const def = window.ALL_ITEMS[r];
      ctx.fillStyle = def.color + '44';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(def.symbol, slotX, slotsY + slotW/2 + 3);
    }
  }

  
  if (ms.processing) {
    const w = totalW + 6;
    const px = sx - w/2;
    const py = slotsY - 8;
    ctx.fillStyle = '#0a0908';
    ctx.fillRect(px, py, w, 4);
    ctx.fillStyle = '#ff7a2e';
    ctx.fillRect(px, py, w * ms.progress, 4);
    ctx.fillStyle = '#ffb15a';
    ctx.fillRect(px, py, Math.max(2, w * ms.progress - 2), 1);
  }

  
  if (ms.ready) {
    const def = window.ALL_ITEMS[m.output];
    const bob = Math.sin(t * 3 + m.x) * 3;
    drawGlowDot(ctx, sx, gy - 100 + bob, def.color, def.glow, 10);
    ctx.fillStyle = def.glow;
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(def.symbol, sx, gy - 95 + bob);
  }
}


function drawCrucible(ctx, sx, gy, t, ms, m) {
  const b = gy;
  
  ctx.fillStyle = '#1a1612';
  ctx.fillRect(sx - 26, b - 8, 52, 8);
  ctx.fillStyle = '#2a221a';
  ctx.fillRect(sx - 26, b - 8, 52, 2);
  
  ctx.fillStyle = '#272019';
  ctx.fillRect(sx - 22, b - 32, 44, 24);
  ctx.fillStyle = '#3a2f24';
  ctx.fillRect(sx - 22, b - 32, 44, 2);
  ctx.fillStyle = '#15110d';
  ctx.fillRect(sx - 22, b - 10, 44, 2);
  
  ctx.fillStyle = '#0a0807';
  [-18, 18].forEach(dx => {
    ctx.fillRect(sx + dx, b - 26, 2, 2);
    ctx.fillRect(sx + dx, b - 14, 2, 2);
  });
  
  ctx.fillStyle = '#0a0807';
  ctx.fillRect(sx - 18, b - 36, 36, 6);
  
  const glow = ms.processing ? .9 + Math.sin(t*8)*.1 : .35;
  const grd = ctx.createLinearGradient(0, b - 38, 0, b - 30);
  grd.addColorStop(0, `rgba(255,177,90,${glow})`);
  grd.addColorStop(1, `rgba(255,90,30,${glow*.5})`);
  ctx.fillStyle = grd;
  ctx.fillRect(sx - 16, b - 36, 32, 6);
  
  if (ms.processing) {
    for (let i = 0; i < 5; i++) {
      const ex = sx - 12 + ((t*30 + i*9) % 24);
      const ey = b - 38 - Math.floor(Math.sin(t*5+i)*1.5+2);
      ctx.fillStyle = '#ffd87a';
      ctx.fillRect(ex, ey, 2, 2);
    }
  }
  
  ctx.fillStyle = '#1a1612';
  ctx.fillRect(sx - 4, b - 48, 8, 16);
  ctx.fillStyle = '#2a221a';
  ctx.fillRect(sx - 4, b - 48, 8, 2);
  drawNamePlate(ctx, sx, b - 2, m.name);
}

function drawCondenser(ctx, sx, gy, t, ms, m) {
  const b = gy;
  
  ctx.fillStyle = '#1a1612';
  ctx.fillRect(sx - 22, b - 8, 44, 8);
  
  ctx.fillStyle = '#1f2a30';
  ctx.fillRect(sx - 18, b - 28, 36, 20);
  ctx.fillStyle = '#2c3a44';
  ctx.fillRect(sx - 18, b - 28, 36, 2);
  ctx.fillStyle = '#1f2a30';
  ctx.fillRect(sx - 14, b - 44, 28, 16);
  ctx.fillStyle = '#2c3a44';
  ctx.fillRect(sx - 14, b - 44, 28, 2);
  ctx.fillStyle = '#1f2a30';
  ctx.fillRect(sx - 10, b - 58, 20, 14);
  ctx.fillStyle = '#2c3a44';
  ctx.fillRect(sx - 10, b - 58, 20, 2);
  
  const cy = b - 66;
  const cglow = ms.processing ? .95 : .5;
  ctx.fillStyle = `rgba(168,240,255,${cglow})`;
  ctx.fillRect(sx - 4, cy - 8, 8, 8);
  ctx.fillStyle = `rgba(79,214,255,${cglow})`;
  ctx.fillRect(sx - 2, cy - 6, 4, 6);
  ctx.fillStyle = '#fff';
  ctx.fillRect(sx - 1, cy - 4, 2, 2);
  
  const hg = ctx.createRadialGradient(sx, cy - 4, 0, sx, cy - 4, 30);
  hg.addColorStop(0, `rgba(168,240,255,${cglow*.5})`);
  hg.addColorStop(1, 'rgba(168,240,255,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(sx - 30, cy - 34, 60, 60);
  
  if (ms.processing) {
    for (let i = 0; i < 4; i++) {
      const dy = ((t*60 + i*18) % 50);
      ctx.fillStyle = '#a8f0ff';
      ctx.fillRect(sx - 10 + i*7, b - 50 + dy, 2, 2);
    }
  }
  drawNamePlate(ctx, sx, b - 2, m.name);
}

function drawLoom(ctx, sx, gy, t, ms, m) {
  const b = gy;
  
  ctx.fillStyle = '#1a1612';
  ctx.fillRect(sx - 24, b - 32, 4, 32);
  ctx.fillRect(sx + 20, b - 32, 4, 32);
  
  ctx.fillRect(sx - 24, b - 40, 48, 8);
  ctx.fillStyle = '#2a221a';
  ctx.fillRect(sx - 24, b - 40, 48, 2);
  
  ctx.fillStyle = '#5a4a3a';
  for (let i = 0; i < 7; i++) {
    ctx.fillRect(sx - 18 + i * 6, b - 32, 1, 32);
  }
  
  const thread = ms.processing ? '#caa4ff' : '#3a342a';
  ctx.fillStyle = thread;
  const yOff = ms.processing ? Math.floor(t * 30) % 6 : 0;
  for (let y = b - 30 + yOff; y < b - 2; y += 6) {
    ctx.fillRect(sx - 18, y, 36, 1);
  }
  
  ctx.fillStyle = '#1a1612';
  ctx.fillRect(sx - 6, b - 22, 12, 12);
  ctx.fillStyle = ms.processing ? '#caa4ff' : '#3a342a';
  ctx.fillRect(sx - 4, b - 20, 8, 8);
  ctx.fillStyle = ms.processing ? '#e4cfff' : '#5a4a3a';
  ctx.fillRect(sx - 2, b - 18, 4, 4);
  
  if (ms.processing) {
    const grd = ctx.createRadialGradient(sx, b - 16, 0, sx, b - 16, 30);
    grd.addColorStop(0, 'rgba(202,164,255,.5)');
    grd.addColorStop(1, 'rgba(202,164,255,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(sx - 30, b - 46, 60, 50);
  }
  drawNamePlate(ctx, sx, b - 2, m.name);
}

function drawForge(ctx, sx, gy, t, ms, m) {
  const b = gy;
  
  ctx.fillStyle = '#0e0c09';
  ctx.fillRect(sx - 36, b - 8, 72, 8);
  ctx.fillStyle = '#1a1612';
  ctx.fillRect(sx - 32, b - 16, 64, 8);
  ctx.fillStyle = '#2a221a';
  ctx.fillRect(sx - 32, b - 16, 64, 2);
  
  ctx.fillStyle = '#1a1612';
  ctx.fillRect(sx - 28, b - 52, 8, 36);
  ctx.fillRect(sx + 20, b - 52, 8, 36);
  ctx.fillStyle = '#2a221a';
  ctx.fillRect(sx - 28, b - 52, 8, 2);
  ctx.fillRect(sx + 20, b - 52, 8, 2);
  
  ctx.fillStyle = '#1a1612';
  ctx.fillRect(sx - 32, b - 56, 16, 4);
  ctx.fillRect(sx + 16, b - 56, 16, 4);
  
  ctx.fillStyle = '#1f1a14';
  ctx.fillRect(sx - 12, b - 32, 24, 16);
  ctx.fillStyle = '#3a2f24';
  ctx.fillRect(sx - 12, b - 32, 24, 2);
  ctx.fillStyle = '#0a0807';
  ctx.fillRect(sx - 8, b - 28, 16, 8);
  
  const fg = ms.processing ? .95 : .55;
  ctx.fillStyle = `rgba(255,216,122,${fg})`;
  ctx.fillRect(sx - 4, b - 26, 8, 4);
  ctx.fillStyle = ms.ready ? '#fff2c2' : '#ffd87a';
  ctx.fillRect(sx - 2, b - 24, 4, 2);
  
  const rcx = sx;
  const rcy = b - 70;
  ctx.strokeStyle = ms.processing ? '#fff2c2' : '#5a4a3a';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(rcx, rcy, 22, 0, Math.PI*2);
  ctx.stroke();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + t * (ms.processing ? 1.5 : .3);
    const rx = rcx + Math.cos(a) * 22;
    const ry = rcy + Math.sin(a) * 22;
    ctx.fillStyle = ms.processing ? '#fff2c2' : '#7a6a5a';
    ctx.fillRect(Math.round(rx) - 2, Math.round(ry) - 2, 4, 4);
  }
  
  if (ms.processing || ms.ready) {
    const grd = ctx.createRadialGradient(rcx, rcy, 0, rcx, rcy, 60);
    grd.addColorStop(0, 'rgba(255,216,122,.45)');
    grd.addColorStop(1, 'rgba(255,216,122,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(rcx - 60, rcy - 60, 120, 120);
  }
  drawNamePlate(ctx, sx, b - 2, m.name);
}

function drawNamePlate(ctx, x, y, label) {
  const w = label.length * 6 + 10;
  ctx.fillStyle = 'rgba(10,8,7,.85)';
  ctx.fillRect(x - w/2, y, w, 10);
  ctx.fillStyle = '#8a8273';
  ctx.font = '8px JetBrains Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(label.toUpperCase(), x, y + 8);
}

function drawOrderBoard(ctx, camX, t, state) {
  const wx = tileToPx(BOARD_X);
  const sx = wx - camX;
  if (sx < -120 || sx > ctx.canvas.width + 120) return;
  const gy = groundAt(BOARD_X) * TILE;
  
  ctx.fillStyle = '#1a1612';
  ctx.fillRect(sx - 30, gy - 64, 6, 64);
  ctx.fillRect(sx + 24, gy - 64, 6, 64);
  
  ctx.fillStyle = '#2a221a';
  ctx.fillRect(sx - 32, gy - 64, 64, 44);
  ctx.fillStyle = '#3a2f24';
  ctx.fillRect(sx - 32, gy - 64, 64, 2);
  ctx.fillStyle = '#1a1612';
  ctx.fillRect(sx - 30, gy - 62, 60, 40);
  
  const flick = .7 + Math.sin(t*7)*.3;
  ctx.fillStyle = '#1a1612';
  ctx.fillRect(sx - 2, gy - 66, 4, 4);
  ctx.fillStyle = `rgba(255,177,90,${flick})`;
  ctx.fillRect(sx - 2, gy - 72, 4, 6);
  ctx.fillStyle = `rgba(255,255,255,${flick*.8})`;
  ctx.fillRect(sx - 1, gy - 71, 2, 3);
  
  const grd = ctx.createRadialGradient(sx, gy - 70, 0, sx, gy - 70, 60);
  grd.addColorStop(0, `rgba(255,177,90,${flick*.55})`);
  grd.addColorStop(1, 'rgba(255,177,90,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(sx - 60, gy - 130, 120, 80);
  
  const papers = state.orders.slice(0, 3);
  papers.forEach((o, i) => {
    const px = sx - 22 + (i % 3) * 16;
    const py = gy - 56 + (i % 2) * 4;
    ctx.fillStyle = '#d8cfbf';
    ctx.globalAlpha = .85;
    ctx.fillRect(px, py, 12, 16);
    ctx.globalAlpha = 1;
    
    ctx.fillStyle = '#ff7a2e';
    ctx.fillRect(px + 5, py - 1, 2, 2);
    
    ctx.fillStyle = '#3a2f24';
    ctx.fillRect(px + 2, py + 3, 8, 1);
    ctx.fillRect(px + 2, py + 6, 5, 1);
    ctx.fillRect(px + 2, py + 9, 7, 1);
    
    const def = window.ALL_ITEMS[o.id];
    ctx.fillStyle = def.color;
    ctx.fillRect(px + 4, py + 12, 4, 3);
  });
  drawNamePlate(ctx, sx, gy - 18, 'ORDERS');
}

function drawDrop(ctx, d, camX, t) {
  const sx = d.x - camX;
  const sy = d.y + Math.sin(t * 3 + d.id) * 2;
  const def = window.ALL_ITEMS[d.kind];
  drawGlowDot(ctx, sx, sy, def.color, def.glow, 6);
  ctx.fillStyle = def.glow;
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(def.symbol, sx, sy + 4);
}

function drawParticle(ctx, p, camX) {
  const sx = p.x - camX;
  ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
  ctx.fillStyle = p.color;
  ctx.fillRect(Math.round(sx), Math.round(p.y), p.size, p.size);
  ctx.globalAlpha = 1;
}

function drawForegroundDust(ctx, W, H, t) {
  ctx.save();
  ctx.globalAlpha = .25;
  for (let i = 0; i < 22; i++) {
    const seed = mulberry32(i + 11);
    const sx = (seed() * W + t * (12 + seed()*22)) % (W + 40) - 20;
    const sy = (seed() * H * .9) + Math.sin(t * .8 + i) * 6;
    ctx.fillStyle = '#5a4a3a';
    ctx.fillRect(Math.floor(sx), Math.floor(sy), 2, 2);
  }
  ctx.restore();
}


function drawPlayer(ctx, p, camX, t) {
  const sx = Math.round(p.x - camX);
  const sy = Math.round(p.y);
  const facing = p.facing;
  const walking = Math.abs(p.vx) > 0.1 && p.grounded;
  const frame = walking ? Math.floor(t * 8) % 4 : 0;
  const bob = walking ? (frame === 1 || frame === 3 ? -2 : 0) : Math.sin(t * 2) * 1;

  
  
  if (p.grounded) {
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath();
    ctx.ellipse(sx, sy + 1, 10, 3, 0, 0, Math.PI*2);
    ctx.fill();
  }
  
  ctx.fillStyle = '#1a1612';
  if (walking) {
    if (frame === 0) { ctx.fillRect(sx - 5, sy - 5, 4, 5); ctx.fillRect(sx + 1, sy - 7, 4, 7); }
    else if (frame === 1) { ctx.fillRect(sx - 5, sy - 7, 4, 7); ctx.fillRect(sx + 1, sy - 5, 4, 5); }
    else if (frame === 2) { ctx.fillRect(sx - 5, sy - 7, 4, 7); ctx.fillRect(sx + 1, sy - 5, 4, 5); }
    else { ctx.fillRect(sx - 5, sy - 5, 4, 5); ctx.fillRect(sx + 1, sy - 7, 4, 7); }
  } else {
    ctx.fillRect(sx - 5, sy - 7, 4, 7);
    ctx.fillRect(sx + 1, sy - 7, 4, 7);
  }
  
  ctx.fillStyle = '#2a1f18';
  ctx.fillRect(sx - 7, sy - 20 + bob, 14, 14);
  
  ctx.fillStyle = '#3a2f24';
  ctx.fillRect(sx - 7, sy - 20 + bob, 14, 2);
  
  ctx.fillStyle = '#ff7a2e';
  ctx.fillRect(sx - 5, sy - 12 + bob, 10, 2);
  ctx.fillStyle = '#ffb15a';
  ctx.fillRect(sx - 1, sy - 12 + bob, 2, 2);
  
  ctx.fillStyle = '#3a2f24';
  ctx.fillRect(sx - 7, sy - 8 + bob, 14, 2);
  
  ctx.fillStyle = '#1a1612';
  ctx.fillRect(sx - 5, sy - 28 + bob, 10, 8);
  ctx.fillStyle = '#2a221a';
  ctx.fillRect(sx - 5, sy - 28 + bob, 10, 2);
  
  ctx.fillStyle = '#0a0807';
  ctx.fillRect(sx - 3, sy - 24 + bob, 6, 4);
  
  ctx.fillStyle = '#ffb15a';
  ctx.fillRect(sx + (facing > 0 ? 1 : -3), sy - 22 + bob, 2, 2);
  
  if (facing > 0) {
    ctx.fillStyle = '#2a1f18';
    ctx.fillRect(sx + 6, sy - 16 + bob, 2, 7);
    ctx.fillStyle = '#1a1612';
    ctx.fillRect(sx + 7, sy - 8 + bob, 4, 4);
    const flick = .7 + Math.sin(t*9)*.3;
    ctx.fillStyle = `rgba(255,177,90,${flick})`;
    ctx.fillRect(sx + 7, sy - 12 + bob, 4, 4);
    ctx.fillStyle = `rgba(255,255,200,${flick})`;
    ctx.fillRect(sx + 8, sy - 11 + bob, 2, 2);
  } else {
    ctx.fillStyle = '#2a1f18';
    ctx.fillRect(sx - 8, sy - 16 + bob, 2, 7);
    ctx.fillStyle = '#1a1612';
    ctx.fillRect(sx - 11, sy - 8 + bob, 4, 4);
    const flick = .7 + Math.sin(t*9)*.3;
    ctx.fillStyle = `rgba(255,177,90,${flick})`;
    ctx.fillRect(sx - 11, sy - 12 + bob, 4, 4);
    ctx.fillStyle = `rgba(255,255,200,${flick})`;
    ctx.fillRect(sx - 10, sy - 11 + bob, 2, 2);
  }
  
  const grd = ctx.createRadialGradient(sx, sy - 14, 4, sx, sy - 14, 80);
  grd.addColorStop(0, 'rgba(255,177,90,.22)');
  grd.addColorStop(1, 'rgba(255,177,90,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(sx - 80, sy - 94, 160, 110);

  
  if (p.holding) {
    const def = window.ALL_ITEMS[p.holding];
    const hx = sx + facing * 10;
    const hy = sy - 28 + Math.sin(t * 4) * 1.5;
    drawGlowDot(ctx, hx, hy, def.color, def.glow, 7);
    ctx.fillStyle = def.glow;
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(def.symbol, hx, hy + 4);
  }
}

Object.assign(window, {
  drawWorld, NODE_DEFS, MACHINE_DEFS, PRODUCT_DEFS, ALL_ITEMS, NODE_TO_RES,
  TILE, WORLD_W, GROUND_Y, BOARD_X, VISIBLE_TILES_X,
  groundAt, getHeightmap, mulberry32, lerpHex, tileToPx,
});

</script>
<script type="text/babel">






class MinHeap {
  constructor(keyFn) { this.h = []; this.key = keyFn || (x => x); }
  push(v) {
    this.h.push(v);
    let i = this.h.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (this.key(this.h[p]) <= this.key(this.h[i])) break;
      [this.h[p], this.h[i]] = [this.h[i], this.h[p]];
      i = p;
    }
  }
  pop() {
    if (!this.h.length) return null;
    const top = this.h[0];
    const last = this.h.pop();
    if (this.h.length) {
      this.h[0] = last;
      let i = 0;
      const n = this.h.length;
      while (true) {
        const l = 2*i+1, r = 2*i+2;
        let s = i;
        if (l < n && this.key(this.h[l]) < this.key(this.h[s])) s = l;
        if (r < n && this.key(this.h[r]) < this.key(this.h[s])) s = r;
        if (s === i) break;
        [this.h[i], this.h[s]] = [this.h[s], this.h[i]];
        i = s;
      }
    }
    return top;
  }
  peek() { return this.h[0]; }
  get size() { return this.h.length; }
}






function findPath(startTile, goalTile, blockedSet) {
  const open = new MinHeap(n => n.f);
  const seen = new Set();
  open.push({ x: startTile, g: 0, f: Math.abs(goalTile - startTile), parent: null });
  while (open.size > 0) {
    const cur = open.pop();
    if (cur.x === goalTile) {
      const path = [];
      let n = cur;
      while (n) { path.unshift(n.x); n = n.parent; }
      return path;
    }
    if (seen.has(cur.x)) continue;
    seen.add(cur.x);
    for (const dx of [-1, 1]) {
      const nx = cur.x + dx;
      if (nx < 2 || nx >= window.WORLD_W - 2) continue;
      if (seen.has(nx)) continue;
      if (blockedSet && blockedSet.has(nx)) continue;
      const ng = cur.g + 1;
      const nh = Math.abs(goalTile - nx);
      open.push({ x: nx, g: ng, f: ng + nh, parent: cur });
    }
    if (open.size > 5000) break; 
  }
  return null;
}






function spawnSpirit(state, orderId, fromLeft) {
  const spawnX = fromLeft ? 4 : window.WORLD_W - 4;
  const goalX = window.BOARD_X - (fromLeft ? 1 : -1);
  const path = findPath(spawnX, goalX, null) || [spawnX, goalX];
  state.spirits.push({
    sid: state.nextSpiritId++,
    orderId,                  
    x: window.tileToPx(spawnX),
    targetX: window.tileToPx(goalX),
    path,
    pathIdx: 0,
    bobPhase: Math.random() * Math.PI * 2,
    age: 0,
    state: 'walking',         
    fadeOut: 0,
    fromLeft,
  });
}

function stepSpirits(state, dt) {
  for (const sp of state.spirits) {
    sp.age += dt;
    sp.bobPhase += dt * 2.5;
    if (sp.state === 'walking') {
      
      const target = sp.targetX;
      const speed = 60;
      if (Math.abs(sp.x - target) < 2) {
        sp.state = 'waiting';
        sp.x = target;
      } else {
        sp.x += Math.sign(target - sp.x) * speed * dt;
      }
    } else if (sp.state === 'blooming') {
      sp.fadeOut += dt;
      
      sp.x += (Math.sin(sp.age * 3) * 8) * dt;
    } else if (sp.state === 'withering') {
      sp.fadeOut += dt;
    }
  }
  state.spirits = state.spirits.filter(sp => {
    if (sp.state === 'blooming' && sp.fadeOut > 1.6) return false;
    if (sp.state === 'withering' && sp.fadeOut > 1.2) return false;
    return true;
  });
}


function bloomSpiritFor(state, orderId) {
  const sp = state.spirits.find(s => s.orderId === orderId && s.state === 'waiting');
  if (sp) sp.state = 'blooming';
}
function witherSpiritFor(state, orderId) {
  const sp = state.spirits.find(s => s.orderId === orderId && s.state === 'waiting');
  if (sp) sp.state = 'withering';
}


function drawSpirit(ctx, sp, camX, t, state) {
  const sx = sp.x - camX;
  const groundTile = Math.floor(sp.x / window.TILE);
  const gy = window.tileToPx(window.groundAt(groundTile));
  const bob = Math.sin(sp.bobPhase) * 2;
  const sy = gy - 22 + bob;

  if (sx < -40 || sx > ctx.canvas.width + 40) return;

  let alpha = 1;
  let scale = 1;
  let tint = '#a8c0ff';
  if (sp.state === 'blooming') {
    alpha = Math.max(0, 1 - sp.fadeOut / 1.6);
    scale = 1 + sp.fadeOut * 0.6;
    tint = '#ffd87a';
  } else if (sp.state === 'withering') {
    alpha = Math.max(0, 1 - sp.fadeOut / 1.2);
    tint = '#5a3a3a';
  } else if (sp.state === 'waiting') {
    tint = '#caa4ff';
  }

  ctx.save();
  ctx.globalAlpha = alpha * 0.85;
  ctx.translate(sx, sy);
  ctx.scale(scale, scale);

  
  ctx.fillStyle = tint;
  ctx.globalAlpha = alpha * 0.25;
  for (let i = 0; i < 4; i++) {
    const wy = i * 5 + Math.sin(sp.bobPhase + i) * 1.5;
    const ww = Math.max(1, 4 - i);
    ctx.fillRect(-ww/2, 12 + wy, ww, 1);
  }

  
  ctx.globalAlpha = alpha * 0.9;
  ctx.fillStyle = '#1a1f29';
  ctx.fillRect(-4, -6, 8, 12);   
  ctx.fillRect(-5, -3, 10, 6);   
  ctx.fillRect(-3, -10, 6, 6);   

  
  ctx.fillStyle = '#000';
  ctx.fillRect(-2, -8, 4, 3);

  
  ctx.fillStyle = tint;
  ctx.fillRect(-2, -7, 1, 1);
  ctx.fillRect(1, -7, 1, 1);

  
  ctx.globalAlpha = alpha * (0.3 + Math.sin(sp.bobPhase) * 0.1);
  ctx.beginPath();
  ctx.fillStyle = tint;
  ctx.arc(0, -2, 10, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  
  if (sp.state === 'waiting' || sp.state === 'walking') {
    const order = state.orders.find(o => o.oid === sp.orderId);
    if (order) {
      const def = window.ALL_ITEMS[order.id];
      const glyphY = sy - 24 + Math.sin(sp.bobPhase * 1.3) * 1.5;
      ctx.save();
      ctx.globalAlpha = alpha * 0.9;
      
      ctx.fillStyle = '#000';
      ctx.fillRect(sx - 8, glyphY - 7, 16, 14);
      ctx.strokeStyle = def.glow;
      ctx.lineWidth = 1;
      ctx.strokeRect(sx - 7.5, glyphY - 6.5, 15, 13);
      
      ctx.fillStyle = def.glow;
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(def.symbol, sx, glyphY);
      
      if (order.timeLeft < order.maxTime * 0.3) {
        ctx.fillStyle = '#ff5a3a';
        ctx.fillRect(sx - 1, glyphY + 7, 2, 2);
      }
      ctx.restore();
    }
  }

  
  if (sp.state === 'blooming' && Math.random() < 0.5) {
    state.particles.push({
      x: sp.x + (Math.random() - 0.5) * 20,
      y: sy + (Math.random() - 0.5) * 20,
      vx: (Math.random() - 0.5) * 30,
      vy: -40 - Math.random() * 30,
      gravity: 20,
      life: 1.0, maxLife: 1.0,
      color: '#ffd87a',
      size: 2,
    });
  }
  if (sp.state === 'withering' && Math.random() < 0.3) {
    state.particles.push({
      x: sp.x + (Math.random() - 0.5) * 14,
      y: sy + (Math.random() - 0.5) * 14,
      vx: (Math.random() - 0.5) * 10,
      vy: 20 + Math.random() * 20,
      gravity: 40,
      life: 0.8, maxLife: 0.8,
      color: '#3a2620',
      size: 2,
    });
  }
}

function drawSpirits(ctx, state, t) {
  for (const sp of state.spirits) drawSpirit(ctx, sp, state.camX, t, state);
}

Object.assign(window, {
  spawnSpirit, stepSpirits, bloomSpiritFor, witherSpiritFor, drawSpirits,
  findPath, MinHeap,
});
